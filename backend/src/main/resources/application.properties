# ================================
# CONFIGURACIÓN DE LA APLICACIÓN
# ================================
spring.application.name=back

# ================================
# CONFIGURACIÓN DE LA BASE DE DATOS (MariaDB)
# ================================
spring.datasource.url=jdbc:mariadb://localhost:3306/Kainfo
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ================================
# CONFIGURACIÓN DE HIBERNATE / JPA
# ================================
# Dialecto correcto para Hibernate 7+
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# Mostrar consultas SQL en consola (desarrollo)
spring.jpa.show-sql=true

# Formatear consultas SQL para legibilidad
spring.jpa.properties.hibernate.format_sql=true

# Control de creación/actualización de tablas
# update = actualiza la base de datos según entidades
spring.jpa.hibernate.ddl-auto=update

# ================================
# CONFIGURACIÓN DEL POOL DE CONEXIONES HIKARI
# ================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ================================
# OTRAS PROPIEDADES ÚTILES
# ================================
# Evita la validación automática de los datos al iniciar (opcional)
spring.jpa.open-in-view=false